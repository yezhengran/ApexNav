defaults:
  - /benchmark/nav/objectnav:
      - objectnav_hm3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/hm3d/v2/{split}/{split}.json.gz # HM3D-v2 dataset
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 0.2
  simulator:
    habitat_sim_v0:
      allow_sliding: false
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        radius: 0.18
        sim_sensors:
          depth_sensor:
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama # deepseek, ollama or none
    ollama: "qwen3:8b"

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_hm3dv2_{split}"
test_epi_num: -1

# Opt-in DynZSON-inspired experiment; baseline never constructs this controller.
active_view:
  mode: baseline  # baseline, selected_review
  backend: blip2  # qwen is an explicit extra-review-only experiment
  qwen_model: qwen3-vl-plus
  qwen_budget_ledger: ""
  itm_confirm_threshold: 0.65
  itm_reject_threshold: 0.20
  uncertain_after_steps: 350
  max_inspection_steps: 48
  max_stationary_steps: 24
  recent_evidence: false  # A1: bounded recent crops and verification during observation
  turn_first: false       # A2: orient before translating; stop after 3 blocked advances
  linked_evidence: false  # Explicit mapper source IDs and per-candidate keyframes
  stop_review: false      # B only: original STOP with missing/conflicting evidence
